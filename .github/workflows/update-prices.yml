name: Update stock prices

on:
  schedule:
    # 21:30 UTC, Mon-Fri = after US market close year-round (16:30/17:30 ET
    # depending on DST). Cron is UTC only, so this drifts by an hour across
    # the DST change -- fine for a daily close price, not worth the complexity
    # of handling it exactly.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Fetch latest prices
        run: python scripts/fetch_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "stock-shock-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/prices.json
          if git diff --cached --quiet; then
            echo "No new data, nothing to commit."
          else
            git commit -m "Update prices $(date -u +%Y-%m-%d)"
            git push
          fi
